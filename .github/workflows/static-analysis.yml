name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography defusedxml pylint bandit flake8

      - name: Run the program
        run: python tax_calculator.py

      - name: Flake8
        run: python -m flake8 tax_calculator.py | tee flake8_report.txt
        shell: bash -o pipefail {0}

      - name: Bandit
        run: python -m bandit -r tax_calculator.py | tee bandit_report.txt
        shell: bash -o pipefail {0}

      - name: Pylint (score must be above 9.5)
        run: python -m pylint --fail-under=9.5 tax_calculator.py | tee pylint_report.txt
        shell: bash -o pipefail {0}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            flake8_report.txt
            bandit_report.txt
            pylint_report.txt
